<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1376" class="dg dg-tall" role="img" aria-labelledby="egm-tall-title egm-tall-desc">
<title id="egm-tall-title">englishgamematters.ru: доступ к играм и игровые комнаты</title>
<desc id="egm-tall-desc">Две схемы: учитель открывает игру на сайте, ссылка передаёт его почту в зашифрованном виде сервису доступа, тот проверяет срок подписки и открывает игру из закрытого хранилища либо закрывает доступ; учитель создаёт комнату, получает пропуск на 10 минут, ученики входят по QR-коду, в комнате до 30 игроков.</desc>
<style>
.dg-box{fill:var(--bg-2);stroke:var(--line-2);stroke-width:1.25}
.dg-acc{stroke:var(--accent);stroke-width:1.5}
.dg-off{fill:none;stroke-dasharray:4 5}
.dg-edge{fill:none;stroke:var(--line-2);stroke-width:1.5}
.dg-alt{stroke-dasharray:5 6}
.dg-rule{fill:none;stroke:var(--line-2);stroke-width:1}
.dg-tip{fill:none;stroke:var(--fg-3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dg-dot{fill:var(--fg-3)}
.dg-btn{fill:none;stroke:var(--accent);stroke-width:1.25}
.dg-t{font-family:var(--f-text);font-size:18px;font-weight:500;fill:var(--fg)}
.dg-t.dg-dim{fill:var(--fg-2)}
.dg-s{font-family:var(--f-text);font-size:15px;fill:var(--fg-2)}
.dg-m{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;fill:var(--fg-3)}
.dg-h{font-family:var(--f-display);font-size:28px;fill:var(--fg)}
.dg-tall .dg-t{font-size:22px}
.dg-tall .dg-s{font-size:18px}
.dg-tall .dg-m{font-size:16px}
.dg-tall .dg-h{font-size:32px}
</style>
<defs>
<marker id="egm-tall-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path class="dg-tip" d="M2.5 1.5 9 5 2.5 8.5"/></marker>
</defs>
<g class="dg-node dg-lane"><text class="dg-h" x="24" y="54">Доступ к игре</text></g>
<g class="dg-node">
<rect class="dg-box" x="24" y="80" width="512" height="100" rx="14"/>
<text class="dg-t" x="46" y="122">Учитель открывает игру на сайте</text>
<text class="dg-m" x="46" y="154">Тильда</text>
</g>
<path class="dg-edge" pathLength="1" d="M280 180V224" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node">
<rect class="dg-box" x="24" y="224" width="512" height="96" rx="14"/>
<text class="dg-t" x="46" y="266">Ссылка несёт почту учителя</text>
<text class="dg-t" x="46" y="294">в зашифрованном виде</text>
</g>
<path class="dg-edge" pathLength="1" d="M280 320V364" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node">
<rect class="dg-box" x="24" y="364" width="512" height="100" rx="14"/>
<text class="dg-t" x="46" y="406">Сервис доступа</text>
<text class="dg-m" x="46" y="438">Node 20 · nginx · TLS</text>
</g>
<path class="dg-edge" pathLength="1" d="M280 464V508" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node">
<rect class="dg-box dg-acc" x="24" y="508" width="512" height="100" rx="14"/>
<text class="dg-t" x="46" y="550">Проверка срока подписки</text>
<text class="dg-m" x="46" y="582">NocoDB</text>
</g>
<path class="dg-edge" pathLength="1" d="M148 608V676" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node dg-lbl"><text class="dg-m" x="160" y="646">да</text></g>
<g class="dg-node">
<rect class="dg-box" x="24" y="676" width="248" height="124" rx="14"/>
<text class="dg-t" x="46" y="718">Игра открывается</text>
<text class="dg-t" x="46" y="746">из закрытого</text>
<text class="dg-t" x="46" y="774">хранилища</text>
</g>
<path class="dg-edge dg-alt" d="M412 608V676" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node dg-lbl"><text class="dg-m" x="400" y="646" text-anchor="end">нет или сбой</text></g>
<g class="dg-node">
<rect class="dg-box dg-off" x="288" y="676" width="248" height="68" rx="14"/>
<text class="dg-t dg-dim" x="310" y="718">Доступ закрыт</text>
</g>
<path class="dg-rule" d="M24 840H536"/>
<g class="dg-node dg-lane"><text class="dg-h" x="24" y="890">Игровая комната</text></g>
<g class="dg-node">
<rect class="dg-box" x="24" y="916" width="512" height="68" rx="14"/>
<text class="dg-t" x="46" y="958">Учитель создаёт комнату</text>
</g>
<path class="dg-edge" pathLength="1" d="M280 984V1028" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node">
<rect class="dg-box" x="24" y="1028" width="512" height="100" rx="14"/>
<text class="dg-t" x="46" y="1070">Пропуск учителя на 10 минут</text>
<text class="dg-m" x="46" y="1102">подпись Ed25519</text>
</g>
<path class="dg-edge" pathLength="1" d="M280 1128V1172" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node">
<rect class="dg-box" x="24" y="1172" width="512" height="68" rx="14"/>
<text class="dg-t" x="46" y="1214">Ученики входят по QR-коду</text>
</g>
<path class="dg-edge" pathLength="1" d="M280 1240V1284" marker-end="url(#egm-tall-arrow)"/>
<g class="dg-node">
<rect class="dg-box" x="24" y="1284" width="512" height="68" rx="14"/>
<text class="dg-t" x="46" y="1326">До 30 игроков в комнате</text>
</g>
</svg>
